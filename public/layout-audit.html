<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poker Summit 表示検証</title><style>body{margin:12px;background:#eee;font-family:sans-serif}iframe{display:block;width:390px;height:850px;border:1px solid #bbb;background:white}button,select{padding:10px;margin:4px}header{position:sticky;top:0;background:#eee;padding:8px;z-index:3}</style><header><strong>PC・スマホ別の表示検証</strong><button data-width="1280">PC 1280</button><button data-width="1024">PC 1024</button><button data-width="390">スマホ 390</button><button data-width="375">スマホ 375</button><button data-width="320">スマホ 320</button><select aria-label="ページ"><option value="/">TOP</option><option value="/stores">店舗一覧</option><option value="/events">イベント</option><option value="/coupons">クーポン</option><option value="/jobs">求人</option><option value="/major-tournaments">大型大会</option><option value="/blog">BLOG</option><option value="/admin/stores">総合管理</option><option value="/store/profile">店舗管理</option></select><select aria-label="検証先"><option value="https://poker-summit.vercel.app">公開中</option><option value="">このプレビュー</option></select><b id="width">390px</b></header><iframe title="Poker Summit" src="https://poker-summit.vercel.app/"></iframe><script>const frame=document.querySelector("iframe");document.querySelectorAll("[data-width]").forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+"px";document.querySelector("#width").textContent=b.dataset.width+"px"});const selects=document.querySelectorAll("select");selects.forEach(s=>s.onchange=()=>frame.src=selects[1].value+selects[0].value);</script></html>
