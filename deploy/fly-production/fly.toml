# Production room server in Tokyo (11/5 ring release). One machine: ring tables and tournaments live in this process.
# Exactly one machine: ring tables, stamps and shown cards live in this process.
app = "poker-room-server-prod"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  POKER_ROOM_HOST = "0.0.0.0"
  PORT = "3001"
  POKER_ROOM_MAX_ROOMS = "32"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/version"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
