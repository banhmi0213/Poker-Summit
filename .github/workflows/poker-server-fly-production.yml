name: Deploy poker server to Fly (production, Tokyo)

# Production room server for pokersummit.jp (ring release 2026/11/05). Runs on every push to main, after
# "Poker engine tests" pass for that commit, like the staging deploy.
# Secrets (repository secrets, values never printed):
#   FLY_API_TOKEN                   - same Fly.io deploy token as staging
#   POKER_PROD_SUPABASE_SECRET_KEY  - production Supabase secret key (owner pastes it: Supabase > Project Settings > API Keys)
# The encryption key for saved hands (POKER_ROOM_KEYS_JSON) is made once on Fly by the first deploy and then kept
# there; it is never regenerated or printed.
# Everything else is public configuration and lives here.
# Without the secrets the job is skipped, so main keeps deploying normally on Vercel.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SUPABASE_SECRET: ${{ secrets.POKER_PROD_SUPABASE_SECRET_KEY }}
      APP: poker-room-server-prod
    steps:
      - name: Check the secrets
        id: token
        run: if [ -n "$FLY_API_TOKEN" ] && [ -n "$SUPABASE_SECRET" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "Production poker server secrets are not all set; skipping."; fi
      - name: Wait for Poker engine tests on this commit
        if: steps.token.outputs.ok == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" --jq '[.workflow_runs[]|select(.name=="Poker engine tests")|.status+":"+(.conclusion//"")]|join(",")')
            echo "Poker engine tests: ${runs:-not started}"
            case "$runs" in *completed:success*) exit 0;; *completed:*) echo "::error::Poker engine tests did not pass; not deploying."; exit 1;; esac
            sleep 30
          done
          echo "::error::Poker engine tests did not finish in 60 minutes."; exit 1
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        if: steps.token.outputs.ok == 'true'
      - name: Create the app once
        if: steps.token.outputs.ok == 'true'
        run: flyctl apps list --json | grep -q "\"$APP\"" || flyctl apps create "$APP"
      - name: Server secrets
        if: steps.token.outputs.ok == 'true'
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The hand encryption key: made once, then kept on Fly (changing it would make saved hands unreadable).
          if ! flyctl secrets list --app "$APP" --json | grep -q '"POKER_ROOM_KEYS_JSON"'; then
            python3 -I -c 'import json,os,base64;print("POKER_ROOM_KEYS_JSON="+json.dumps({"prod1":base64.b64encode(os.urandom(32)).decode()},separators=(",",":")))' \
              | flyctl secrets import --stage --app "$APP"
          fi
          printf '%s\n' \
            "POKER_SUPABASE_URL=https://tjmeqnzvuoguoffltxrp.supabase.co" \
            "POKER_SUPABASE_PUBLIC_KEY=sb_publishable_y6CMbe42q_9gvwJRZi_etg_F6gEdfKt" \
            "POKER_SUPABASE_SECRET_KEY=$SUPABASE_SECRET" \
            "POKER_ROOM_ACTIVE_KEY=prod1" \
            'POKER_ROOM_ORIGINS=["https://pokersummit.jp","https://www.pokersummit.jp"]' \
            "POKER_SERVER_COMMIT=$COMMIT" \
            | flyctl secrets import --stage --app "$APP"
      - name: Deploy (one machine in Tokyo)
        if: steps.token.outputs.ok == 'true'
        run: flyctl deploy --remote-only --ha=false --config deploy/fly-production/fly.toml --dockerfile deploy/fly-staging/Dockerfile --app "$APP"
      - name: Confirm the new server answers with this commit
        if: steps.token.outputs.ok == 'true'
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            v=$(curl -fsS "https://$APP.fly.dev/version" || true)
            r=$(curl -fsS "https://$APP.fly.dev/readyz" || true)
            echo "version=$v readyz=$r"
            if echo "$v" | grep -qi "\"commit\":\"$COMMIT\"" && echo "$r" | grep -q '"ok":true'; then exit 0; fi
            sleep 10
          done
          echo "::error::The production server did not report commit $COMMIT as ready."; exit 1
