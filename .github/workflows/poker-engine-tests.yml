name: Poker engine tests

on:
  pull_request:
    paths:
      - ".github/workflows/poker-engine-tests.yml"
      - "lib/poker/**"
      - "supabase/migrations/*poker*.sql"
      - "db/tests/poker*"
      - "app/poker-demo/**"
      - "app/poker-online/**"
      - "app/api/poker/**"
      - "app/poker-tournaments/**"
      - "app/admin/poker-tournaments/**"
      - "app/store/(authenticated)/profile/poker-tournaments/**"
      - "app/store/(authenticated)/store-sidebar.tsx"
      - "app/store/(authenticated)/layout.tsx"
      - "app/poker-lobby/**"
      - "tests/poker-*.cjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/poker-engine-tests.yml"
      - "lib/poker/**"
      - "supabase/migrations/*poker*.sql"
      - "db/tests/poker*"
      - "app/poker-demo/**"
      - "app/poker-online/**"
      - "app/api/poker/**"
      - "app/poker-tournaments/**"
      - "app/admin/poker-tournaments/**"
      - "app/store/(authenticated)/profile/poker-tournaments/**"
      - "app/store/(authenticated)/store-sidebar.tsx"
      - "app/store/(authenticated)/layout.tsx"
      - "app/poker-lobby/**"
      - "tests/poker-*.cjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poker-engine-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  poker-engine-tests:
    name: Poker engine regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run poker regression tests
        run: npm run test:poker
      - name: Install isolated test runtimes
        run: npm install --prefix "$RUNNER_TEMP/poker-sql" --no-audit --no-fund @electric-sql/pglite@0.5.10 react-test-renderer@18.3.1
      - name: Verify tournament ownership and permission policies
        env:
          POKER_PGLITE_MODULE: ${{ runner.temp }}/poker-sql/node_modules/@electric-sql/pglite
        run: node db/tests/poker_tournaments_isolated.cjs
      - name: Verify encrypted persistence and backend permissions
        env:
          POKER_PGLITE_MODULE: ${{ runner.temp }}/poker-sql/node_modules/@electric-sql/pglite
        run: node db/tests/poker_persistence_isolated.cjs
      - name: Verify room admission and registry integration
        env:
          POKER_PGLITE_MODULE: ${{ runner.temp }}/poker-sql/node_modules/@electric-sql/pglite
        run: node db/tests/poker_admission_isolated.cjs
      - name: Verify free tournament registration and capacity
        env:
          POKER_PGLITE_MODULE: ${{ runner.temp }}/poker-sql/node_modules/@electric-sql/pglite
        run: node db/tests/poker_registration_isolated.cjs
      - name: Verify management permissions and frozen room handoff
        env:
          POKER_PGLITE_MODULE: ${{ runner.temp }}/poker-sql/node_modules/@electric-sql/pglite
        run: node db/tests/poker_management_isolated.cjs
      - name: Verify tournament UI lifecycle
        env:
          POKER_REACT_RENDERER_MODULE: ${{ runner.temp }}/poker-sql/node_modules/react-test-renderer
        run: node --test tests/poker-lifecycle.cjs tests/poker-online-lifecycle.cjs
