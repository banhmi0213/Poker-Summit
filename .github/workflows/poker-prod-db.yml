name: Production DB poker release (rehearsal / apply)

# Runs deploy/db/build-poker-release-sql.py against the production database in ONE transaction.
#   push to ops/prod-db-rehearsal -> everything runs, then ROLLBACK (nothing changes)
#   push to ops/prod-db-apply     -> everything runs, then COMMIT (11/5 release; owner OK)
# Needs the repository secret POKER_PROD_DB_URL (the direct postgresql:// connection string). Never printed.
on:
  push:
    branches: [ops/prod-db-rehearsal, ops/prod-db-apply]

permissions:
  contents: read

concurrency:
  group: prod-db
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.POKER_PROD_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret
        run: if [ -z "$DB_URL" ]; then echo "::error::POKER_PROD_DB_URL is not set."; exit 1; fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Build the SQL
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "ops/prod-db-apply" ]; then python3 deploy/db/build-poker-release-sql.py > /tmp/release.sql; else python3 deploy/db/build-poker-release-sql.py --rehearsal > /tmp/release.sql; fi
          echo "::notice::mode=${GITHUB_REF_NAME} bytes=$(wc -c < /tmp/release.sql) last=$(tail -n1 /tmp/release.sql)"
      - name: Run it in one transaction
        run: |
          set -o pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f /tmp/release.sql > /tmp/out.txt 2>&1; code=$?
          # Only the error lines (no data, no secrets) go to the summary.
          grep -E "ERROR|LINE|DETAIL|HINT|CONTEXT" /tmp/out.txt | head -20 | while read -r l; do echo "::notice::$l"; done
          grep -n "^-- =====" /tmp/release.sql > /tmp/marks.txt
          line=$(grep -oE "psql:/tmp/release.sql:[0-9]+" /tmp/out.txt | head -1 | cut -d: -f3)
          if [ -n "$line" ]; then mig=$(awk -F: -v l="$line" '$1<=l{m=$0} END{print m}' /tmp/marks.txt); echo "::notice::failed in: $mig (line $line)"; fi
          if [ $code -ne 0 ]; then echo "::error::The release SQL failed; the transaction was rolled back."; exit 1; fi
          echo "::notice::OK: all migrations ran (${GITHUB_REF_NAME})."
      - name: After apply, check the new objects exist
        if: github.ref_name == 'ops/prod-db-apply'
        run: psql "$DB_URL" -X -A -t -c "select count(*) from information_schema.tables where table_schema='poker_private'" | sed 's/^/::notice::poker_private tables: /'
