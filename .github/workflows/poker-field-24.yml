name: Poker 24-player repeat

# Owner 2026/10/31 (100人きたらええな): a full 100-player multi-table tournament with real browsers and the real
# room service, run by hand before a big event (too long for every push).
on:
  workflow_dispatch:
  # Pushing any commit to this branch runs it (a new workflow cannot be dispatched until it is on main).
  push:
    branches: [ci/field-24]

permissions:
  contents: read

jobs:
  field-100:
    name: 100-player multi-table tournament end to end
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build poker server
        run: npm run build:poker-server
      - name: Install isolated test runtimes
        run: npm install --prefix "$RUNNER_TEMP/poker-sql" --no-audit --no-fund @electric-sql/pglite@0.5.10 react-test-renderer@18.3.1 esbuild@0.28.2 @sparticuz/chromium@153.0.0 playwright-core@1.62.1
      - name: Run the 24-player tournament six times
        timeout-minutes: 80
        env:
          POKER_FIELD_ENTRANTS: "24"
          POKER_PGLITE_MODULE: ${{ runner.temp }}/poker-sql/node_modules/@electric-sql/pglite
          POKER_ESBUILD_MODULE: ${{ runner.temp }}/poker-sql/node_modules/esbuild
          POKER_CHROMIUM_MODULE: ${{ runner.temp }}/poker-sql/node_modules/@sparticuz/chromium/build/index.js
          POKER_PLAYWRIGHT_MODULE: ${{ runner.temp }}/poker-sql/node_modules/playwright-core
          POKER_E2E_OUTPUT: ${{ runner.temp }}/poker-field-e2e
        run: |
          fails=0
          for k in 1 2 3 4 5 6; do
            set +e; timeout -k 20s 12m node tests/poker-field-e2e.cjs > run$k.log 2>&1; c=$?; set -e
            if [ "$c" -ne 0 ]; then fails=$((fails+1)); echo "::warning::run $k failed: $(grep -m2 -E "AssertionError|Timed out|Error:" run$k.log | tr '\n' '|' | cut -c1-1800)"; else echo "::notice::run $k passed"; fi
          done
          [ "$fails" -eq 0 ]
