name: Poker flop solutions

# Precomputes the flop browser data (scripts/poker-gto/flop-solve.cjs), one job per flop of one spot.
# Push a gto-flop-solve/<spot>/<anything> branch (spot = a key of scripts/poker-gto/spots.cjs).
# Flops come from data/poker-gto/flops.json; flops already in public/poker-gto/flops/<spot>/ are skipped.
# Results are uploaded as artifacts and gathered by the "collect" workflow.
on:
  push:
    branches: ["gto-flop-solve/**"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      spot: ${{ steps.plan.outputs.spot }}
      flops: ${{ steps.plan.outputs.flops }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          spot="${GITHUB_REF_NAME#gto-flop-solve/}"; spot="${spot%%/*}"
          node -e "const s=require('./scripts/poker-gto/spots.cjs');if(!s['$spot'])process.exit(1)"
          flops=$(node -e "const fs=require('fs');const all=require('./data/poker-gto/flops.json');const dir='public/poker-gto/flops/$spot';console.log(JSON.stringify(all.filter(f=>!fs.existsSync(dir+'/'+f+'.json'))))")
          echo "spot=$spot" >> "$GITHUB_OUTPUT"; echo "flops=$flops" >> "$GITHUB_OUTPUT"; echo "$spot: $flops"
  solve:
    name: Solve ${{ needs.plan.outputs.spot }} ${{ matrix.flop }}
    needs: plan
    if: needs.plan.outputs.flops != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # Keep runners free for the regular test CI (all spots share the account limit of 20 jobs).
      max-parallel: 4
      matrix:
        flop: ${{ fromJSON(needs.plan.outputs.flops) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install TypeScript loader
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund typescript@5.6.3
      - name: Solve
        env:
          NODE_PATH: ${{ runner.temp }}/ts/node_modules
        run: node --max-old-space-size=14000 scripts/poker-gto/flop-solve.cjs --spot ${{ needs.plan.outputs.spot }} --flop ${{ matrix.flop }} --target 0.005 --max-iters 300 --max-minutes 300 --out out
      - uses: actions/upload-artifact@v4
        with:
          name: flop-${{ needs.plan.outputs.spot }}-${{ matrix.flop }}
          path: out/
          retention-days: 14
