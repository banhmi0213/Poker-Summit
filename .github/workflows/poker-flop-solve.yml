name: Poker flop solutions

# Precomputes the flop browser data (scripts/poker-gto/flop-solve.cjs), one job per flop of one spot.
# Push a gto-flop-solve/<spot>/<anything> branch (spot = a key of scripts/poker-gto/spots.cjs).
# Flops come from data/poker-gto/flops.json; flops already solved in version 3 (wider bet menu, per-hand EV) are skipped.
# Each solve runs up to GTO_FLOP_ITERS iterations (the river keeps no averages, so the measured exploitability reads high
# and is not used to stop early). Early stop (2026/11/06): GTO_FLOP_STOP=on stops once the flop strategies stop moving;
# shadow (default) runs to the end and records where it would have stopped, to check the rule first. Each solve splits the turn cards over all the runner's cores (scripts/poker-gto/parallel-flop.cjs).
# Results are uploaded as artifacts and gathered by the "collect" workflow.
on:
  push:
    branches: ["gto-flop-solve/**"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      spot: ${{ steps.plan.outputs.spot }}
      flops: ${{ steps.plan.outputs.flops }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          spot="${GITHUB_REF_NAME#gto-flop-solve/}"; spot="${spot%%/*}"
          node -e "const s=require('./scripts/poker-gto/spots.cjs');if(!s['$spot'])process.exit(1)"
          flops='["Qh8d3c","KhTd7h","8h5d3d","Th6d6c","Jh7h4c","AhJd8c","KhKd5h","Ah6d3d","5h3d3c","Qh9h5h","9h6d4c","QhTdTc"]'
          echo "spot=$spot" >> "$GITHUB_OUTPUT"; echo "flops=$flops" >> "$GITHUB_OUTPUT"; echo "$spot: $flops"
  solve:
    name: Solve ${{ needs.plan.outputs.spot }} ${{ matrix.flop }}
    needs: plan
    if: needs.plan.outputs.flops != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      # GitHub Pro (2026/11/1): the account limit is 40 jobs. At most 5 runs × 7 = 35, leaving runners for the regular test CI.
      max-parallel: 12
      matrix:
        flop: ${{ fromJSON(needs.plan.outputs.flops) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install TypeScript loader
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund typescript@5.6.3
      - name: Solve
        env:
          NODE_PATH: ${{ runner.temp }}/ts/node_modules
        run: node --max-old-space-size=14000 scripts/poker-gto/flop-solve.cjs --spot ${{ needs.plan.outputs.spot }} --flop ${{ matrix.flop }} --target ${{ vars.GTO_FLOP_TARGET || '0' }} --max-iters 150 --check-every 50 --max-minutes 320 --stop on --all-hands 0.002 --threads $(nproc) --out out
      - uses: actions/upload-artifact@v4
        with:
          name: rebuild-${{ needs.plan.outputs.spot }}-${{ matrix.flop }}
          path: out/
          retention-days: 14
