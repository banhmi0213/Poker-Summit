name: Poker flop solutions

# Precomputes the my-page flop browser data (scripts/poker-gto/flop-solve.cjs), one job per flop.
# Runs only when a gto-flop-solve/* branch is pushed; results are uploaded as artifacts and committed separately.
on:
  push:
    branches: ["gto-flop-solve/**"]

permissions:
  contents: read

jobs:
  solve:
    name: Solve ${{ matrix.flop }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        flop: [Ah7d2c, AhKd5c, AhJd8c, Ah5d4c, AhAd7c, Kh7d2c, KhQd6c, KhTd9c, Kh8d8c, Qh8d3c,
               QhJdTc, Qh9d5c, Jh8d4c, JhTd7c, Th9d6c, Th7d3c, 9h5d2c, 8h7d5c, 6h5d4c, 5h4d2c,
               7h7d2c, QhQd5c, AhTh4c, Kh9h3c, Jh9h5c, 8h6h4c, KhTh4h, 7h5h2h, AhQhJh, 9h8h3c]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install TypeScript loader
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund typescript@5.6.3
      - name: Solve
        env:
          NODE_PATH: ${{ runner.temp }}/ts/node_modules
        run: node --max-old-space-size=14000 scripts/poker-gto/flop-solve.cjs --flop ${{ matrix.flop }} --target 0.005 --max-iters 300 --max-minutes 300 --out out
      - uses: actions/upload-artifact@v4
        with:
          name: flop-${{ matrix.flop }}
          path: out/${{ matrix.flop }}.json
          retention-days: 14
