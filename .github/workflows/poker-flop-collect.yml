name: Poker flop solutions collect

# Copies the flop-* artifacts of a "Poker flop solutions" run into public/poker-gto/flops/<spot>/ and pushes them
# to a gto-flop-out/<run id> branch, so they can be reviewed and merged like any other change.
# Trigger: push a gto-flop-collect/<run id> branch.
on:
  push:
    branches: ["gto-flop-collect/**"]

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read run id from branch name
        id: run
        run: echo "id=${GITHUB_REF_NAME#gto-flop-collect/}" >> "$GITHUB_OUTPUT"
      # gh run download pages through every artifact of the run; download-artifact stopped at 100 (2026/11/1: a
      # 200-flop run came back with only its first 100 flops).
      - name: Download every flop artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.run.outputs.id }}" --repo "${{ github.repository }}" --pattern 'flop-*' --dir "$RUNNER_TEMP/flops"
          n=$(ls "$RUNNER_TEMP/flops" | wc -l); echo "artifacts: $n"
          mkdir -p public/poker-gto/flops
          for d in "$RUNNER_TEMP"/flops/*/; do cp -r "$d". public/poker-gto/flops/; done
      - name: Commit to gto-flop-results
        run: |
          set -o pipefail
          exec > >(tee log.txt) 2>&1
          trap 'tail -n 8 log.txt | while IFS= read -r l; do echo "::warning::${l:0:500}"; done' EXIT
          ls -la public/poker-gto/flops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "gto-flop-out/${{ steps.run.outputs.id }}"
          git add public/poker-gto/flops
          git commit -m "フロップ戦略の計算結果（run ${{ steps.run.outputs.id }}）"
          git push -f origin "gto-flop-out/${{ steps.run.outputs.id }}"
