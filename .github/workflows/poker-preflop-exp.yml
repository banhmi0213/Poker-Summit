name: Poker preflop experiments

# GTO rebuild (2026/11/09, owner: プリフロップに全力で、40台使え): solve many preflop variants at once, one job per variant
# listed in data/poker-gto/exp/variants.json ({name, table, env}). Each job uploads its chart as an artifact; the comparison
# with the reference charts runs outside the repository. Trigger: push a gto-pf-exp/<anything> branch.
on:
  push:
    branches: ["gto-pf-exp/**"]

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.v.outputs.variants }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "variants=$(cat data/poker-gto/exp/variants.json)" >> "$GITHUB_OUTPUT"
  solve:
    needs: plan
    name: Solve ${{ matrix.v.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install TypeScript loader
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund typescript@5.6.3
      - name: Extra settings
        run: echo '${{ toJSON(matrix.v.vars || fromJSON('{}')) }}' | jq -r 'to_entries[]|"\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - name: Solve
        env:
          GTO_3WAY_R: ${{ matrix.v.env || '0.28,0.15' }}
          NODE_PATH: ${{ runner.temp }}/ts/node_modules
        run: |
          mkdir -p out
          node --max-old-space-size=6000 scripts/poker-gto/preflop-solve.cjs --seats 6 --sizes wizard --postflop ${{ matrix.v.table }} --iters ${{ vars.GTO_PF_EXP_ITERS || '1000' }} --out out/${{ matrix.v.name }}.json
      - name: Push chart
        run: |
          # Artifacts are not reachable from the comparison machine; each chart goes to its own branch instead.
          B="gto-pf-exp-out/${GITHUB_REF_NAME#gto-pf-exp/}-${{ matrix.v.name }}"
          mkdir -p "$RUNNER_TEMP/o" && cp out/${{ matrix.v.name }}.json "$RUNNER_TEMP/o/chart.json"
          cd "$RUNNER_TEMP/o" && git init -q -b "$B" && git add chart.json && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "${{ matrix.v.name }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$B"
