name: Poker preflop charts

# Solves the preflop charts (scripts/poker-gto/preflop-solve.cjs; 6-max and, with --seats, 8- and 9-max, owner 2026/11/1)
# one job per variant, with the hand playability fitted to published solver ranges (data/poker-gto/preflop-play-fit.json), then pushes the files to a gto-preflop-out/<run id> branch to be reviewed and merged like any other change.
# Trigger: push a gto-preflop-solve/<anything> branch.
on:
  push:
    branches: ["gto-preflop-solve/**"]

permissions:
  contents: write
  actions: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      parallel: ${{ steps.capacity.outputs.parallel }}
    steps:
      - name: Check repository job capacity
        id: capacity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PYCODE'
          import os,json,subprocess
          repo=os.environ['REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/'+path],text=True))
          ids={40922255985,40922261771,41279675288,41279680906,41279681140,int(os.environ['THIS_RUN'])}
          for status in ['in_progress','queued','waiting']:
              for page in api('actions/runs?status='+status+'&per_page=100'):
                  ids.update(r['id'] for r in page['workflow_runs'])
          running=0
          for rid in sorted(ids):
              jobs=[j for page in api(f'actions/runs/{rid}/jobs?per_page=100') for j in page['jobs']]
              n=sum(j['status']=='in_progress' for j in jobs)
              running+=n
              print(rid,n)
          other=max(0,running-1)
          slots=min(2,23-other)
          print('repository running jobs including capacity check:',running,'fit parallel:',slots)
          if slots<1: raise SystemExit('No capacity below the 23-job limit; no fit started')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'parallel={slots}\n')
          PYCODE
  solve:
    needs: capacity
    name: Solve ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.capacity.outputs.parallel) }}
      matrix:
        include:
          - {name: 6max-20bb, args: "--seats 6 --stack 20 --ante 1"}
          - {name: 6max-40bb, args: "--seats 6 --stack 40 --ante 1"}
          - {name: 6max-60bb, args: "--seats 6 --stack 60 --ante 1"}
          - {name: 8max-20bb, args: "--seats 8 --stack 20 --ante 1"}
          - {name: 8max-40bb, args: "--seats 8 --stack 40 --ante 1"}
          - {name: 8max-60bb, args: "--seats 8 --stack 60 --ante 1"}
          - {name: 9max-20bb, args: "--seats 9 --stack 20 --ante 1"}
          - {name: 9max-40bb, args: "--seats 9 --stack 40 --ante 1"}
          - {name: 9max-60bb, args: "--seats 9 --stack 60 --ante 1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install TypeScript loader
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund typescript@5.6.3
      - name: Solve
        env:
          NODE_PATH: ${{ runner.temp }}/ts/node_modules
        run: |
          mkdir -p out
          name="${{ matrix.name }}"; seats="${name%%max*}"; rest="${name#*max-}"
          if [ "$seats" = 6 ]; then base="preflop"; else base="preflop-${seats}max"; fi
          if [ "$rest" = 100bb ]; then file="$base.json"; else file="$base-$rest.json"; fi
          fit=""; [ -f data/poker-gto/preflop-play-fit.json ] && fit="--fit data/poker-gto/preflop-play-fit.json"
          node --max-old-space-size=6000 scripts/poker-gto/preflop-solve.cjs ${{ matrix.args }} $fit --iters ${{ vars.GTO_PREFLOP_ITERS || '2000' }} --out "out/$file"
      - uses: actions/upload-artifact@v4
        with:
          name: preflop-${{ matrix.name }}
          path: out/
          retention-days: 14
  collect:
    needs: solve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preflop-*
          merge-multiple: true
          path: out
      - name: Push the charts to gto-preflop-out/<run id>
        run: |
          set -euo pipefail
          for seats in 6 8 9; do
            for stack in 20 40 60; do
              if [ "$seats" = 6 ]; then base=preflop; dest=public/poker-gto; else base="preflop-${seats}max"; dest=data/poker-gto/paid; fi
              file="$base-${stack}bb.json"
              test -s "out/$file"
              mkdir -p "$dest"
              cp "out/$file" "$dest/$file"
              git add "$dest/$file"
            done
          done
          node scripts/poker-gto/compare-mtt.cjs data/poker-gto/paid
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "gto-preflop-out/${{ github.run_id }}"
          git commit -m "Generate fitted 20/40/60BB tournament charts (run ${{ github.run_id }})"
          git push origin "gto-preflop-out/${{ github.run_id }}"
